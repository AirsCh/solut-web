<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLUT - Login Petugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border">
        <div class="text-center mb-6">
            <div class="text-blue-600 font-bold text-3xl">SOLUT</div>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Sistem Administrasi Petugas</p>
        </div>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="loginUsername" placeholder="Contoh: admin atau petugas1" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" id="btnLoginSubmit" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition mt-2">Masuk ke Sistem</button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-blue-600 hover:underline">&larr; Kembali</a>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
