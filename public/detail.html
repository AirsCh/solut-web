<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLUT - Detail Pengajuan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-50 w-full">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Tautan Logo SOLUT ke index.html -->
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                <div class="text-blue-600 font-bold text-2xl">SOLUT</div>
                <div class="text-xs text-gray-500 uppercase leading-tight">Dashboard<br>Loktabat Utara</div>
            </a>
            <div class="flex gap-3 items-center">
                <a href="dashboard.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition mr-2">&larr; Kembali</a>
                <span id="labelPetugasAktif" class="text-sm font-medium text-gray-600 hidden sm:block"></span>
                <button id="btnLogout" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-md text-sm font-medium hover:bg-red-100 transition">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-grow py-10 px-4 container mx-auto max-w-4xl">
        <!-- HEADER IDENTITAS SURAT -->
        <div class="bg-white p-6 rounded-t-xl border-b flex justify-between items-center">
            <div>
                <span id="detJenisSurat" class="bg-blue-100 text-blue-800 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wide">Memuat...</span>
                <h1 class="text-2xl font-bold text-gray-800 mt-2" id="detNama">Nama Pemohon</h1>
                <p class="text-sm text-gray-500">ID: <span id="detId">MEMUAT...</span></p>
            </div>
        </div>

        <!-- CONTAINER 1: SELURUH DATA INFORMASI (TERURUT SESUAI FORM) -->
        <div class="bg-white rounded-b-xl shadow-sm border-x border-b p-6 mb-6">
            <h2 class="font-bold text-gray-800 text-lg mb-4 pb-2 border-b">Informasi Pengajuan</h2>
            <div id="containerSemuaInformasi" class="space-y-3">
                <p class="text-sm text-gray-400 italic">Memuat seluruh data pengajuan...</p>
            </div>
        </div>

        <!-- CONTAINER 2 (TERPISAH DI BAWAH): NOMOR TELEPON & BERKAS LAMPIRAN -->
        <div class="bg-white rounded-xl shadow-sm border p-6 mb-8">
            <h2 class="font-bold text-gray-800 text-lg mb-4 pb-2 border-b">Kontak & Berkas Lampiran</h2>
            <div class="space-y-3">
                <div class="flex justify-between p-3 bg-gray-50 rounded-lg items-center">
                    <div>
                        <span class="text-xs text-gray-400 block uppercase font-medium">No. HP / WhatsApp Aktif</span>
                        <span id="copyHp" class="font-medium text-gray-800">Memuat data...</span>
                    </div>
                    <button class="btn-copy text-xs border border-gray-300 bg-white px-3 py-1.5 rounded hover:bg-gray-100 flex items-center gap-1" data-target="copyHp">📋 Salin</button>
                </div>

                <div class="flex justify-between p-3 bg-gray-50 rounded-lg items-center">
                    <div>
                        <span class="text-xs text-gray-400 block uppercase font-medium">Berkas Lampiran</span>
                        <span class="font-medium text-blue-600">Dokumen Pendukung (PDF)</span>
                    </div>
                    <a id="btnBukaFile" href="#" target="_blank" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 font-medium">👁️ Buka / Download</a>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
